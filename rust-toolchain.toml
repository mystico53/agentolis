# Pinned deliberately, and NOT to the machine default of 1.94.0.
#
# The egui 0.36 family declares `rust-version = "1.95"`; `cargo check` on 1.94.0
# fails at resolution time with a message that reads like a dependency problem
# rather than a toolchain one, which is exactly the trap this file exists to
# avoid on a fresh clone or a CI runner. See docs/DECISIONS.md ADR-0001 and
# docs/verified/gpu-stack.md.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
