[workspace]
resolver = "3"
members = [
    "polis-hook",
    "polis-events",
    "polis-ingest",
    "polis-repo",
    "polis-layout",
    "polis-world",
    "polis-render",
    "polis-term",
    "polis-sessiond",
    "polis-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The workspace floor is 1.95, NOT the 1.94 the environment brief assumed.
# `docs/verified/gpu-stack.md` measured, and this workspace re-verified, that the
# egui 0.36 family (ecolor/eframe/egui/egui-wgpu/egui-winit/emath/epaint) declares
# `rust-version = 1.95` and `cargo check` refuses outright on 1.94.0. See ADR-0001
# in docs/DECISIONS.md. `polis-hook` alone is std-only and builds far below this.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mystico53/agentolis"

# ---------------------------------------------------------------------------
# Shared dependency pins.
#
# Every version here was resolved and compiled by a recon agent on this machine
# (rustc 1.98.0, x86_64-pc-windows-msvc) or taken from the crates.io index today.
# Members refer to them with `{ workspace = true }` so a bump happens in one place.
#
# Three crates are deliberately ABSENT and must never be added:
#   * `wgpu`  — eframe 0.36.1 re-exports it (`eframe::wgpu`). A direct dependency
#               silently resolves to a *different* wgpu the day eframe bumps, and
#               the Device/Queue type mismatch that follows is famously opaque.
#   * `winit` — same story; eframe pins 0.30.13, not the 0.31.0-beta.2 on crates.io.
#   * `noise` — PRD §7.4 requires byte-identical layout across machines *and*
#               across releases. `noise` makes no output-stability promise between
#               versions, so a patch bump would silently reshuffle every city ever
#               generated. Simplex is written out in
#               `polis_layout::determinism` instead, exactly as
#               `LogicalPath::layout_seed` is written out rather than using
#               `DefaultHasher`. See ADR-0050.
# See docs/verified/gpu-stack.md, ADR-0012 and ADR-0050.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- internal ---------------------------------------------------------------
polis-events = { path = "polis-events", version = "0.1.0" }
polis-ingest = { path = "polis-ingest", version = "0.1.0" }
polis-repo = { path = "polis-repo", version = "0.1.0" }
polis-layout = { path = "polis-layout", version = "0.1.0" }
polis-world = { path = "polis-world", version = "0.1.0" }
polis-render = { path = "polis-render", version = "0.1.0" }
polis-term = { path = "polis-term", version = "0.1.0", default-features = false }

# --- serialization ----------------------------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps transcript object key order stable, which matters for
# golden-file tests (docs/verified/jsonl-schema.md §12).
serde_json = { version = "1.0.151", features = ["preserve_order"] }

# --- errors -----------------------------------------------------------------
anyhow = "1.0.104"
thiserror = "2.0.20"

# --- ingest (Channel A: OTLP/gRPC) ------------------------------------------
# Compile-verified in docs/verified/otlp-receiver.md §9 with these exact features.
#
# `tonic-prost` and `prost` are NOT *required*: the `ProstCodec::default()` call
# in the generated stubs lives inside opentelemetry-proto, which carries its own
# `tonic-prost` dep, and §1 proved the receiver builds with both removed. They are
# declared below anyway, for one reason: no agent after the contract agent may edit
# a `Cargo.toml`, and a hand-written test client or a `prost::Message` round-trip
# is a plausible thing for the receiver's tests to want. Both are already in the
# resolved graph via opentelemetry-proto, so declaring them costs zero build time
# and zero extra crates. `prost-types` stays out — nothing in the OTLP surface
# uses `google.protobuf.*` wrappers.
tonic = { version = "0.14.6", default-features = false, features = [
    "router",
    "server",
    "transport",
    "codegen",
    "gzip",
] }
# `trace` is REQUIRED, not optional: it is the only channel that distinguishes a
# subagent's tool call from the main agent's (docs/verified/otel-schema.md, ADR-0006).
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [
    "gen-tonic",
    "logs",
    "metrics",
    "trace",
] }
# No "macros": the runtime is constructed explicitly on a named background
# thread. There is no `#[tokio::main]` anywhere in Polis — winit owns main.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
] }
tokio-stream = { version = "0.1.17", default-features = false, features = ["net"] }
# Both are transitive dependencies of opentelemetry-proto already; see the note
# above the `tonic` pin for why they are declared directly.
prost = "0.14.4"
tonic-prost = "0.14.6"

# --- terminal ---------------------------------------------------------------
# The VT state machine and the pty. Nobody should write a VTE parser twice, and
# `alacritty_terminal` *is* the ConPTY code Alacritty itself ships — which is
# what `polis-app/src/run.rs`'s "anything else is a pty emulation Polis has no
# reason to write" was really objecting to. See ADR-0095.
#
# `vte` arrives here and is **re-exported** as `alacritty_terminal::vte`. It must
# never be pinned directly: a second copy in the graph is the exact failure the
# wgpu/winit ban above exists to prevent.
#
# Measured against this workspace's existing lock, `alacritty_terminal 0.26.0`
# adds nine crates and *no* second `windows-sys`: it wants 0.61.2, which
# `notify` already pulls in. See `docs/roadmap/terminal-integration.md`.
alacritty_terminal = "0.26.0"
# The pty master's readiness comes from a `polling::Poller`, not from a blocking
# `read` — measured, see ADR-0095. Already in the lock via `alacritty_terminal`;
# declared because `polis-term` names the type in its own signatures.
polling = "3.11.0"
# Pane bytes cross the session-daemon boundary inside JSON, which cannot hold
# arbitrary bytes. Already in the lock via `opentelemetry-proto`; zero new crates.
base64 = "0.22.1"

# --- ingest (Channel C: filesystem watch) -----------------------------------
# 8.2.0 is the latest STABLE. 9.0.0-rc.5 exists but is a release candidate.
notify = "8.2.0"

# --- event bus / concurrency ------------------------------------------------
crossbeam-channel = "0.5.16"
arc-swap = "1.9.2"
rayon = "1.12.0"

# --- repo indexing ----------------------------------------------------------
tree-sitter = "0.27.0"
# Grammar pins. The version numbers look mismatched against the 0.27 runtime and
# are not: since tree-sitter 0.24 a grammar crate depends on the tiny
# `tree-sitter-language` ABI shim (0.1.x) and **not** on the runtime, so the
# grammar version tracks the *grammar's* releases, not the parser's. All four
# below declare `tree-sitter-language = "0.1"` and nothing else, and all four are
# proven loadable into a `tree_sitter::Parser` at runtime 0.27.0 by
# `polis-repo/tests/grammar_abi.rs`. These are the latest published versions of
# each. See ADR-0051.
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# --- layout -----------------------------------------------------------------
# No `noise` crate — see the ABSENT list above and ADR-0050.
lyon = "1.0.19"

# --- rendering --------------------------------------------------------------
# default-features = false drops the glow renderer; "wgpu" selects the one Polis
# uses. eframe re-exports egui, egui_wgpu and wgpu from its root.
eframe = { version = "0.36.1", default-features = false, features = [
    "wgpu",
    "default_fonts",
] }
bytemuck = { version = "1.25.2", features = ["derive"] }

# --- misc -------------------------------------------------------------------
smallvec = { version = "1.16.0", features = ["union", "const_generics"] }
# WARNING: `ahash`'s default `RandomState` is seeded per process, so an `AHashMap`
# whose iteration order can reach a layout or a serialized artifact violates
# PRD §7.4. Use it only for hot lookup tables that are never iterated for output;
# use `BTreeMap` everywhere else.
ahash = "0.8.12"
clap = { version = "4.6.6", features = ["derive"] }
# Structured logging. Polis installs no subscriber by default: this is the
# channel a `--verbose` run and `polis doctor` read, and PRD §4.1's "unknown
# event types are logged at debug and dropped, never fatal" is a `tracing::debug!`.
tracing = "0.1.44"

# --- dev --------------------------------------------------------------------
insta = "1.48.0"
criterion = "0.8.2"
tempfile = "3.27.0"
# Property tests for the defensive parsers PRD §16 requires. Genuine fuzzing
# (`cargo-fuzz` + `libfuzzer-sys`) lives in a separate, nightly-only `fuzz/`
# crate outside this workspace; it is not a dev-dependency of any member.
proptest = "1.11.0"

# ---------------------------------------------------------------------------
# Lints. Every member opts in with `[lints] workspace = true`.
#
# `missing_docs = "warn"` plus CI's `clippy -D warnings` is what enforces the
# rule that every public item names the PRD section it implements.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
# MSVC's `link.exe` prints an informational "creating library … and object …"
# line whenever a binary links a `__declspec(dllexport)` symbol, which every
# tree-sitter grammar's generated C emits. `rustc` surfaces that as a
# `linker_messages` warning, so a `cargo test` that touches `polis-repo` is
# permanently noisy on Windows through no fault of any code. Nothing else on the
# lint reaches us as a warning — a duplicate or missing symbol is an error.
linker_messages = "allow"
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deliberate opt-outs, each with a reason:
# `polis_events::EventKind` etc. read better with the crate name repeated.
module_name_repetitions = "allow"
# The skeleton is signatures with `todo!()` bodies; error/panic prose lands with
# the implementation. Re-enable per crate once a crate is real.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# ---------------------------------------------------------------------------
# Profiles.
# ---------------------------------------------------------------------------

# The application. `thin` LTO rather than `fat`: the wgpu + tonic tree is large
# and fat LTO costs minutes per build for a UI whose bottleneck is the GPU.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"
panic = "unwind"

# `polis-hook` only. Build it with:
#     cargo build --profile hook -p polis-hook
#
# Every setting is load-bearing and measured in docs/verified/hook-ipc.md:
# this binary is spawned once per hook event on a real agent's critical path,
# so size and dynamic-link cost are the budget. `panic = "abort"` is safe ONLY
# because main() installs a panic hook that exits 0 first — without it a panic
# exits 0xC0000409 and cancels the agent's tool call (ADR-0009).
[profile.hook]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug-assertions = false
incremental = false

# Golden-layout tests (PRD §16) replay real git history; an unoptimised
# polis-layout makes them take minutes instead of seconds.
[profile.test.package.polis-layout]
opt-level = 2
[profile.test.package.polis-repo]
opt-level = 2
