name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning in CI is a failure. The workspace is at zero.
  RUSTFLAGS: -D warnings

jobs:
  # PRD §16 demands the layout determinism check run on two operating systems,
  # so the whole suite runs on both rather than only the golden-file test — a
  # nondeterminism bug that only shows up under a different std or a different
  # float unit would otherwise hide in the crate that produced it.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # No toolchain input: rust-toolchain.toml pins 1.98.0 with rustfmt and
      # clippy. Pinning matters — the egui 0.36 family needs >= 1.95 and the
      # failure on an older toolchain reads like a dependency problem (ADR-0001).
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # eframe/wgpu need X11 and Wayland development headers on Linux even for
      # `cargo check`, because egui-winit links against them.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libx11-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # PRD §14: "polis-hook must have a near-empty dependency tree — it is
      # spawned hundreds of times per second and its binary size and dynamic-link
      # cost are on the critical path." Measured, it needs nothing but std, so
      # the assertion is exact rather than approximate (ADR-0036).
      #
      # `cargo tree -p polis-hook` prints exactly one line: the package itself.
      - name: polis-hook has no dependencies
        shell: bash
        run: |
          tree=$(cargo tree -p polis-hook -e normal --no-dedupe)
          echo "$tree"
          lines=$(printf '%s\n' "$tree" | grep -c .)
          if [ "$lines" -ne 1 ]; then
            echo "::error::polis-hook grew a dependency tree ($lines lines)."
            echo "::error::It is spawned once per hook event on an agent's critical path."
            exit 1
          fi

      # Built with the dedicated profile so the shipped artifact — not a debug
      # build — is what gets exercised.
      - name: Build the hook with its own profile
        run: cargo build --profile hook -p polis-hook

  # PRD §7.4 requires byte-identical layout across runs — the class of bug PRD
  # §16 calls out as "a common source of nondeterminism, and it will be subtle
  # when it bites."
  #
  # Note what the step below does and does not do. `RUST_TEST_SHUFFLE` shuffles
  # the ORDER TESTS RUN IN; it does not randomize `HashMap` iteration. Rust needs
  # no such switch — `RandomState` already seeds from the OS in every process, so
  # every run is differently ordered — and the tests that actually hunt this are
  # `two_fresh_processes_agree` and `hash_map_iteration_order_cannot_move_the_city`.
  # Shuffling still earns its place: it catches a test that only passes because an
  # earlier test warmed a cache or a `OnceLock`.
  # The matrix here is not decoration, and it is not the same matrix as `check`'s.
  # The bug this job exists to catch was **release-only**, and a release-only bug
  # is also plausibly platform-only: `f64`-to-`f32` rounding, `atan2`, and the
  # order a filesystem hands back a directory are all places where Linux and
  # Windows can differ while each stays perfectly self-consistent. PRD §15's gate
  # is "byte-identical across two machines", so the profile that actually ships
  # has to be exercised on both of them rather than only on the cheaper runner —
  # otherwise the two-OS leg covers debug and the release leg covers one OS, and
  # release-on-Windows is covered by neither.
  nondeterminism:
    name: nondeterminism hunt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libx11-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Test with shuffled test order
        run: cargo test -p polis-layout -p polis-repo -p polis-events
        env:
          # Catches a test that only passes because an earlier one warmed a cache.
          RUST_TEST_SHUFFLE: 1
          RUST_TEST_THREADS: 1

      # The determinism suite MUST run in release as well, and this is not
      # belt-and-braces. `debug_assert!` compiles to nothing when
      # `debug_assertions` is off, so every guard written as a `debug_assert` is
      # absent from the profile the product actually ships. A layout invariant
      # that is only enforced by a debug assertion is not enforced at all.
      #
      # This is not hypothetical: `city::build_streets` asserted its input was in
      # canonical order and returned it unsorted, so `CityLayout::streets`
      # serialized in caller order. Every `cargo test` passed and the release
      # snapshot changed when the caller's `Vec` was permuted — PRD §15's
      # "byte-identical layout" broken in the only build that ships.
      # `caller_supplied_input_order_cannot_move_the_city` covers it, and its
      # adversarial half runs ONLY here.
      - name: Determinism suite in release
        run: cargo test --release -p polis-layout -p polis-repo -p polis-events

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libx11-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      # Every public item names the PRD section it implements; `missing_docs` is
      # a workspace lint and broken intra-doc links are how those citations rot.
      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
