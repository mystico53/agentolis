[package]
name = "polis-ingest"
description = "Polis ingest: OTLP/gRPC receiver, hook UDP listener, JSONL tailer, filesystem watcher (PRD §4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
polis-events = { workspace = true }
# Channel A. `trace` on opentelemetry-proto is required, not optional: see ADR-0006.
tonic = { workspace = true }
opentelemetry-proto = { workspace = true }
# Not needed to *build* the receiver (docs/verified/otlp-receiver.md §1 proved
# that), but declared so a hand-written test client or a `prost::Message`
# round-trip needs no manifest edit. Both are already in the resolved graph.
prost = { workspace = true }
tonic-prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
# Channel C.
notify = { workspace = true }
# The bus (PRD §4.5).
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Transcript fixtures, endpoint files and watched directories all want a real
# path that cleans itself up.
tempfile = { workspace = true }
# PRD §16 mandates the transcript parser degrade rather than panic on arbitrary
# input; that is a property, so it gets a property test.
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
