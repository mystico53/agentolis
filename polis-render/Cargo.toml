[package]
name = "polis-render"
description = "Polis renderer: CPU rasteriser, the live notation, semantic zoom (PRD §10, §13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
polis-events = { workspace = true }
polis-layout = { workspace = true }
polis-world = { workspace = true }
# NO GPU stack here, and that is load-bearing rather than incidental. This
# crate rasterises on the CPU into plain sRGB bytes; the wgpu tier ADR-0012
# shaped its public surface around was declared and never implemented, and was
# removed with it (ADR-0110). eframe, lyon and bytemuck went with it. The GPU
# enters the workspace exactly once, in `polis-app`, which opens the window.
thiserror = { workspace = true }
# `pacing` reads Channel D records to tell a tool call apart from a paragraph of
# assistant text; the transcript carries them verbatim as `Value` (PRD §4.4).
serde_json = { workspace = true }

[dev-dependencies]
# The plan renderer's tests need a repository to draw; PRD §16's fixtures are
# git checkouts, and a synthetic tree is the one that runs without `bash`.
polis-repo = { workspace = true }
# `pacing`'s tests build a `ReplaySchedule` by hand, which needs the parser's
# `ParseStats` to fill the field the reader would have filled.
polis-ingest = { workspace = true }

[lints]
workspace = true
